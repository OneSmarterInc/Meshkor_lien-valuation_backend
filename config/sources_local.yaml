# Paths for your folder D:\Datasetof CMS (unzipped downloads, one folder per source).
# Use it with these two lines in .env:
#   MESHKOR_RAW_DIR=D:/Datasetof CMS
#   MESHKOR_SOURCES=sources_local.yaml
# Each `file:` is a folder (or one file) under MESHKOR_RAW_DIR. The hash in each row
# is then the hash of the files in that folder, not of the CMS zip.
#
# NCCI PTP: put the 8 zips in D:\Datasetof CMS\NCCI\PTP\ with the short names below.

