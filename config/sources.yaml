# One entry per downloaded release. Paths are relative to data/raw/.
# Rule (Spec §3.1–3.2): keep the original CMS download unchanged; the loader
# reads the members it needs straight from the zip and hashes the zip.
#
# `members` values are glob patterns matched against names inside the zip.
# Effective dates are inclusive. Open-ended = 9999-12-31.
#
# To add a release: put the zip under data/raw/<source>/<period>/ and add an
# entry here. Then run: python backend/manage.py load_ref <table>

ref_provider:                     # Table 1 — NPPES
  loader: nppes
  releases:
    - period: "2026-10"
      snapshot_date: 2026-10-12
      page: https://download.cms.gov/nppes/NPI_Files.html
      # Either the original zip or the folder you unzipped it into.
      file: nppes/2026-10/NPPES_Data_Dissemination_October_2026_V2.zip
      members:
        main: "npidata_pfile_*[0-9].csv"
        header: "npidata_pfile_*_fileheader.csv"
      deactivation_file: nppes/2026-10/NPPES_Deactivated_NPI_Report_101226_V2.zip

