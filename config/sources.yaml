ref_hcris:                        # Table 7 — Hospital cost reports (2552-10)
  loader: hcris
  # Cells used for the hospital-wide cost-to-charge ratio (Spec §6, table 7).
  # Worksheet C Part I, line 202 (total), column 5 (total costs) and
  # column 8 (total charges). Confirm against HOSP2010_Worksheet_Codes.pdf
  # and one known hospital before sign-off.
  cells:
    total_costs:   {wksht: C000001, line: "20200", col: "00500"}
    total_charges: {wksht: C000001, line: "20200", col: "00800"}
    beds:          {wksht: S300001, line: "01400", col: "00200"}
  releases:
    - period: FY2023
      page: https://www.cms.gov/data-research/statistics-trends-and-reports/cost-reports/cost-reports-fiscal-year
      file: hcris/FY2023/HOSP10FY2023.zip
